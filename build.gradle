plugins {
	id 'net.neoforged.moddev' version '2.0.148'
	id 'maven-publish'
	id 'me.qoomon.git-versioning' version '6.4.4'
	id 'com.diffplug.spotless' version '8.11.0'
	id 'checkstyle'
}

version = project.version

gitVersioning.apply {
	describeTagPattern = 'v(?<version>.*)'
	refs {
		considerTagsOnBranches = true
		tag('v(?<version>.*)') {
			version = '${ref.version}'
		}
		branch('.+') {
			version = '${describe.tag.version.major}.${describe.tag.version.minor}.${describe.tag.version.patch.plus.describe.distance}-dev+${commit.short}'
		}
	}
	rev {
		version = '${commit.short}-SNAPSHOT'
	}
}

def releaseVersion = providers.gradleProperty("releaseVersion").orNull
if (releaseVersion) {
	version = releaseVersion.startsWith("v") ? releaseVersion.substring(1) : releaseVersion
}

group = project.maven_group

base {
	archivesName = project.archives_base_name
}

sourceSets {
	main {
		resources {
			// Client and server datagen outputs live in separate directories so their
			// HashCache stale-purge passes don't delete each other's files.
			// NeoForge 26.3 also writes datapack registry entries during client datagen;
			// those duplicate the server output, so only take assets from the client run.
			srcDir 'src/generated/client'
			srcDir 'src/generated/server'
			def clientDataDir = file('src/generated/client/data')
			exclude { it.file.toPath().startsWith(clientDataDir.toPath()) }
			exclude '.cache/**'
		}
	}
	// GameTests live in their own source set: loaded in dev runs, never shipped in the jar.
	gametest {
		compileClasspath += main.output
		runtimeClasspath += main.output
	}
}

configurations {
	gametestImplementation.extendsFrom implementation
}

repositories {
	maven {
		name = "GeckoLib"
		url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
		content {
			includeGroup("com.geckolib")
		}
	}
}

neoForge {
	version = project.neoforge_version
	validateAccessTransformers = true
	accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

	runs {
		client {
			client()
			systemProperty 'neoforge.enableGameTest', 'true'
		}
		server {
			server()
			programArgument '--nogui'
			// Lets `/test runall` find the GameTests in a dev world
			systemProperty 'neoforge.enableGameTest', 'true'
		}
		gameTestServer {
			type = 'gameTestServer'
		}
		clientData {
			clientData()
			programArguments.addAll(
					'--mod', 'fossilsarch2',
					'--output', file('src/generated/client').absolutePath,
					'--existing', file('src/main/resources').absolutePath
			)
		}
		serverData {
			serverData()
			programArguments.addAll(
					'--mod', 'fossilsarch2',
					'--output', file('src/generated/server').absolutePath,
					'--existing', file('src/main/resources').absolutePath
			)
		}
	}

	mods {
		fossilsarch2 {
			sourceSet sourceSets.main
			sourceSet sourceSets.gametest
		}
	}
}

dependencies {
	// GeckoLib for models and animations (NeoForge variant)
	implementation "com.geckolib:geckolib-neoforge-26.3:${geckolib_version}"
}

neoForge.addModdingDependenciesTo(sourceSets.gametest)

tasks.register("gameTest") {
	group = "verification"
	description = "Runs the GameTests on a headless server; fails if any required test fails."
	dependsOn("runGameTestServer")
}

tasks.register("regenData") {
	group = "neoforge"
	description = "Runs data generation and refreshes src/generated/{client,server}."
	dependsOn("runClientData", "runServerData")
}

tasks.register("checkGeneratedData") {
	group = "verification"
	description = "Fails if data generation would modify src/generated/{client,server}."
	dependsOn("runClientData", "runServerData")
	def rootDir = project.projectDir
	doLast {
		def proc = new ProcessBuilder("git", "status", "--short", "--", "src/generated/client", "src/generated/server")
				.directory(rootDir)
				.redirectErrorStream(true)
				.start()
		def changed = proc.inputStream.text.trim()
		proc.waitFor()
		if (changed) {
			throw new GradleException("Generated data is out of date. Run ./gradlew regenData and commit src/generated/{client,server}.\n" + changed)
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	// Deprecations and unchecked conversions fail the build so they're fixed when introduced.
	it.options.compilerArgs += [
		'-Xlint:deprecation',
		'-Xlint:removal',
		'-Xlint:unchecked',
		'-Werror'
	]
}

// --- Linting ---
// Formatting: ./gradlew spotlessApply (VS Code uses the same Eclipse profile on save).
// Checks:     ./gradlew check  (spotlessCheck + checkstyle + gametests)
spotless {
	java {
		target 'src/**/*.java'
		eclipse().configFile('config/eclipse-formatter.xml')
		importOrder('java', 'javax', '', '\\#')
		removeUnusedImports()
		forbidWildcardImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
	json {
		target 'src/main/resources/**/*.json'
		// Lang files use blank lines to group keys, which a JSON formatter would strip.
		targetExclude 'src/main/resources/assets/**/geckolib/**', 'src/main/resources/assets/**/lang/**'
		gson().indentWithSpaces(4)
	}
	groovyGradle {
		target '*.gradle'
		greclipse()
		leadingSpacesToTabs(4)
	}
}

checkstyle {
	toolVersion = '14.4.0'
	configFile = file('config/checkstyle/checkstyle.xml')
	maxWarnings = 0
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}
